<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="A journal row committing before an outbound payment call, and the reverse order crossed out">
  <defs>
    <linearGradient id="tbBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12211d"/>
      <stop offset="1" stop-color="#0d1714"/>
    </linearGradient>
    <marker id="tbArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7fbfa8"/>
    </marker>
    <marker id="tbArrowBad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#c9705f"/>
    </marker>
  </defs>
  <rect width="640" height="360" fill="url(#tbBg)"/>

  <!-- top row: the correct ordering — journal commits first, then the call goes out -->
  <text x="40" y="52" fill="#f2f0ea" fill-opacity="0.55" font-family="ui-monospace, monospace" font-size="13">ordering that holds</text>

  <rect x="40" y="70" width="150" height="52" rx="6" fill="#7fbfa8" fill-opacity="0.14" stroke="#7fbfa8" stroke-width="1.5"/>
  <text x="115" y="94" fill="#7fbfa8" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">journal row</text>
  <text x="115" y="111" fill="#7fbfa8" fill-opacity="0.7" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">2nd connection</text>

  <line x1="200" y1="96" x2="290" y2="96" stroke="#7fbfa8" stroke-width="2" marker-end="url(#tbArrow)"/>

  <rect x="300" y="70" width="150" height="52" rx="6" fill="#7fbfa8" fill-opacity="0.14" stroke="#7fbfa8" stroke-width="1.5"/>
  <text x="375" y="102" fill="#7fbfa8" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">charge / refund</text>

  <line x1="460" y1="96" x2="550" y2="96" stroke="#7fbfa8" stroke-width="2" marker-end="url(#tbArrow)"/>
  <text x="600" y="101" fill="#7fbfa8" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">safe</text>

  <!-- middle row: the reverse ordering — the 24h key window turns a retry into a second charge -->
  <text x="40" y="182" fill="#f2f0ea" fill-opacity="0.55" font-family="ui-monospace, monospace" font-size="13">what the key window does after 24h</text>

  <rect x="40" y="200" width="150" height="52" rx="6" fill="#c9705f" fill-opacity="0.12" stroke="#c9705f" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="115" y="232" fill="#c9705f" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">retried refund</text>

  <line x1="200" y1="226" x2="290" y2="226" stroke="#c9705f" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#tbArrowBad)"/>

  <rect x="300" y="200" width="150" height="52" rx="6" fill="#c9705f" fill-opacity="0.12" stroke="#c9705f" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="375" y="225" fill="#c9705f" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">key pruned</text>
  <text x="375" y="242" fill="#c9705f" fill-opacity="0.75" font-family="ui-monospace, monospace" font-size="11" text-anchor="middle">reads as new</text>

  <line x1="460" y1="226" x2="550" y2="226" stroke="#c9705f" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#tbArrowBad)"/>
  <text x="596" y="231" fill="#c9705f" font-family="ui-monospace, monospace" font-size="14" text-anchor="middle">2nd charge</text>

  <!-- separator -->
  <line x1="40" y1="290" x2="600" y2="290" stroke="#2f5d50" stroke-opacity="0.4" stroke-width="1"/>

  <!-- the ledger invariant -->
  <text x="40" y="322" fill="#f2f0ea" fill-opacity="0.55" font-family="ui-monospace, monospace" font-size="13">double-entry ledger</text>
  <text x="600" y="322" fill="#7fbfa8" font-family="ui-monospace, monospace" font-size="15" text-anchor="end">trial balance = 0</text>
</svg>
