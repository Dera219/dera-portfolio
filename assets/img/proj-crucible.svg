<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="A time-by-asset grid with everything after a cut point scrambled and everything before it unchanged">
  <defs>
    <linearGradient id="cruBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12211d"/>
      <stop offset="1" stop-color="#0d1714"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#cruBg)"/>

  <!-- axis labels: rows are assets, columns are time -->
  <text x="24" y="46" fill="#7fbfa8" font-family="ui-monospace, monospace" font-size="14" opacity="0.75">assets</text>
  <text x="536" y="336" fill="#7fbfa8" font-family="ui-monospace, monospace" font-size="14" opacity="0.75">time →</text>

  <!-- the panel: left of the cut is orderly, right of it is scrambled -->
  <g>
    <!-- ordered region (t <= cut): calm, aligned cells -->
    <g fill="#7fbfa8">
      <rect x="60"  y="70"  width="26" height="26" opacity="0.85"/>
      <rect x="94"  y="70"  width="26" height="26" opacity="0.55"/>
      <rect x="128" y="70"  width="26" height="26" opacity="0.72"/>
      <rect x="162" y="70"  width="26" height="26" opacity="0.40"/>
      <rect x="196" y="70"  width="26" height="26" opacity="0.66"/>
      <rect x="230" y="70"  width="26" height="26" opacity="0.50"/>
      <rect x="264" y="70"  width="26" height="26" opacity="0.78"/>

      <rect x="60"  y="104" width="26" height="26" opacity="0.48"/>
      <rect x="94"  y="104" width="26" height="26" opacity="0.80"/>
      <rect x="128" y="104" width="26" height="26" opacity="0.38"/>
      <rect x="162" y="104" width="26" height="26" opacity="0.70"/>
      <rect x="196" y="104" width="26" height="26" opacity="0.55"/>
      <rect x="230" y="104" width="26" height="26" opacity="0.86"/>
      <rect x="264" y="104" width="26" height="26" opacity="0.44"/>

      <rect x="60"  y="138" width="26" height="26" opacity="0.72"/>
      <rect x="94"  y="138" width="26" height="26" opacity="0.42"/>
      <rect x="128" y="138" width="26" height="26" opacity="0.60"/>
      <rect x="162" y="138" width="26" height="26" opacity="0.88"/>
      <rect x="196" y="138" width="26" height="26" opacity="0.36"/>
      <rect x="230" y="138" width="26" height="26" opacity="0.64"/>
      <rect x="264" y="138" width="26" height="26" opacity="0.52"/>

      <rect x="60"  y="172" width="26" height="26" opacity="0.58"/>
      <rect x="94"  y="172" width="26" height="26" opacity="0.34"/>
      <rect x="128" y="172" width="26" height="26" opacity="0.82"/>
      <rect x="162" y="172" width="26" height="26" opacity="0.46"/>
      <rect x="196" y="172" width="26" height="26" opacity="0.74"/>
      <rect x="230" y="172" width="26" height="26" opacity="0.62"/>
      <rect x="264" y="172" width="26" height="26" opacity="0.40"/>

      <rect x="60"  y="206" width="26" height="26" opacity="0.66"/>
      <rect x="94"  y="206" width="26" height="26" opacity="0.76"/>
      <rect x="128" y="206" width="26" height="26" opacity="0.44"/>
      <rect x="162" y="206" width="26" height="26" opacity="0.56"/>
      <rect x="196" y="206" width="26" height="26" opacity="0.84"/>
      <rect x="230" y="206" width="26" height="26" opacity="0.38"/>
      <rect x="264" y="206" width="26" height="26" opacity="0.68"/>
    </g>

    <!-- perturbed region (t > cut): scrambled, rotated, holes punched in -->
    <g fill="#c9705f">
      <rect x="356" y="72"  width="24" height="24" opacity="0.86" transform="rotate(9 368 84)"/>
      <rect x="392" y="66"  width="28" height="28" opacity="0.42" transform="rotate(-14 406 80)"/>
      <rect x="462" y="74"  width="22" height="22" opacity="0.74" transform="rotate(21 473 85)"/>
      <rect x="494" y="68"  width="27" height="27" opacity="0.55" transform="rotate(-7 507 81)"/>
      <rect x="562" y="72"  width="25" height="25" opacity="0.80" transform="rotate(16 574 84)"/>

      <rect x="358" y="106" width="27" height="27" opacity="0.50" transform="rotate(-18 371 119)"/>
      <rect x="428" y="102" width="23" height="23" opacity="0.88" transform="rotate(11 439 113)"/>
      <rect x="460" y="108" width="26" height="26" opacity="0.36" transform="rotate(-5 473 121)"/>
      <rect x="528" y="104" width="24" height="24" opacity="0.68" transform="rotate(24 540 116)"/>

      <rect x="392" y="140" width="25" height="25" opacity="0.78" transform="rotate(-11 404 152)"/>
      <rect x="424" y="136" width="28" height="28" opacity="0.46" transform="rotate(17 438 150)"/>
      <rect x="494" y="142" width="22" height="22" opacity="0.84" transform="rotate(-22 505 153)"/>
      <rect x="560" y="138" width="26" height="26" opacity="0.58" transform="rotate(6 573 151)"/>

      <rect x="356" y="174" width="26" height="26" opacity="0.64" transform="rotate(13 369 187)"/>
      <rect x="426" y="170" width="24" height="24" opacity="0.40" transform="rotate(-16 438 182)"/>
      <rect x="458" y="176" width="27" height="27" opacity="0.82" transform="rotate(8 471 189)"/>
      <rect x="530" y="172" width="23" height="23" opacity="0.52" transform="rotate(-20 541 183)"/>
      <rect x="562" y="178" width="25" height="25" opacity="0.72" transform="rotate(19 574 190)"/>

      <rect x="390" y="208" width="24" height="24" opacity="0.56" transform="rotate(-9 402 220)"/>
      <rect x="460" y="204" width="28" height="28" opacity="0.76" transform="rotate(22 474 218)"/>
      <rect x="496" y="210" width="22" height="22" opacity="0.44" transform="rotate(-13 507 221)"/>
      <rect x="560" y="206" width="26" height="26" opacity="0.66" transform="rotate(15 573 219)"/>
    </g>
  </g>

  <!-- the cut point -->
  <line x1="322" y1="52" x2="322" y2="250" stroke="#f2f0ea" stroke-opacity="0.35" stroke-dasharray="4 6"/>
  <text x="300" y="44" fill="#f2f0ea" fill-opacity="0.7" font-family="ui-monospace, monospace" font-size="15" text-anchor="middle">t</text>

  <!-- the assertion -->
  <text x="60" y="280" fill="#7fbfa8" font-family="ui-monospace, monospace" font-size="15">unchanged</text>
  <text x="356" y="280" fill="#c9705f" font-family="ui-monospace, monospace" font-size="15">perturbed</text>
  <text x="60" y="312" fill="#f2f0ea" fill-opacity="0.82" font-family="ui-monospace, monospace" font-size="16">assert f(panel)[:t] == f(perturbed)[:t]</text>
  <text x="60" y="336" fill="#f2f0ea" fill-opacity="0.45" font-family="ui-monospace, monospace" font-size="13">if anything moved, it read the future</text>
</svg>
