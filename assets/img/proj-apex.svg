<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-label="Equity curves diverging in-sample versus out-of-sample">
  <defs>
    <linearGradient id="apexBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12211d"/>
      <stop offset="1" stop-color="#0d1714"/>
    </linearGradient>
    <linearGradient id="apexUp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fbfa8" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#7fbfa8"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#apexBg)"/>
  <!-- grid -->
  <g stroke="#2f5d50" stroke-opacity="0.28" stroke-width="1">
    <line x1="0" y1="90" x2="640" y2="90"/>
    <line x1="0" y1="180" x2="640" y2="180"/>
    <line x1="0" y1="270" x2="640" y2="270"/>
  </g>
  <!-- in-sample: rises then keeps rising (the mirage) -->
  <path d="M20 300 C 140 250, 240 150, 340 120 S 520 70, 620 60"
        fill="none" stroke="url(#apexUp)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="620" cy="60" r="4.5" fill="#7fbfa8"/>
  <text x="470" y="48" fill="#7fbfa8" font-family="ui-monospace, monospace" font-size="15">in-sample</text>
  <!-- out-of-sample: the same idea, honest, drifting down -->
  <path d="M340 120 C 400 150, 470 200, 540 240 S 610 285, 620 300"
        fill="none" stroke="#c9705f" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 7" stroke-opacity="0.95"/>
  <circle cx="620" cy="300" r="4.5" fill="#c9705f"/>
  <text x="440" y="330" fill="#c9705f" font-family="ui-monospace, monospace" font-size="15">out-of-sample</text>
  <!-- the split marker -->
  <line x1="340" y1="40" x2="340" y2="320" stroke="#f2f0ea" stroke-opacity="0.25" stroke-dasharray="4 6"/>
</svg>
